name: Apply Phase 1 fixes

# Temporary one-shot migration for Phase 1.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply phase 1 fixes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Phase 1 patches
        shell: python
        run: |
          from pathlib import Path

          main = Path('main.py')
          s = main.read_text(encoding='utf-8')

          old = 'MAX_SIGNAL_AGE_HOURS = 6  # Strictly 6 hours maximum limit'
          if old not in s:
              raise SystemExit('Expected stale-age constant not found')
          s = s.replace(old, 'MAX_SIGNAL_AGE_HOURS = 1  # Authoritative freshness window: 1 hour')

          old_age = '''def get_signal_age_str(ts_ms):
              if not ts_ms:
                  return "Unknown", "⚠️ STALE"
              now_ms = int(time.time() * 1000)
              diff_ms = now_ms - ts_ms
              diff_min = int(diff_ms / 60000)
              diff_hr = int(diff_min / 60)
              if diff_min < 60:
                  age_str = f"{diff_min} min ago"
                  tag = "✅ FRESH" if diff_min <= 60 else "⚠️ STALE"
              else:
                  age_str = f"{diff_hr} hr {diff_min % 60} min ago"
                  tag = "✅ FRESH" if diff_hr < 2 else "⚠️ STALE"
              return age_str, tag
          '''
          new_age = '''def get_signal_age_str(ts_ms):
              """Authoritative rule: <=60 minutes is FRESH; >60 minutes is STALE."""
              if not ts_ms:
                  return "Unknown", "⚠️ STALE"
              now_ms = int(time.time() * 1000)
              diff_ms = max(0, now_ms - int(ts_ms))
              diff_min = int(diff_ms / 60000)
              if diff_min <= 60:
                  return f"{diff_min} min ago", "✅ FRESH"
              diff_hr = diff_min // 60
              return f"{diff_hr} hr {diff_min % 60} min ago", "⚠️ STALE"
          '''
          if old_age not in s:
              raise SystemExit('Expected get_signal_age_str implementation not found')
          s = s.replace(old_age, new_age)

          marker = '''def send_to_personal_only(message: str, **kwargs):
'''
          helper = '''STARTUP_NOTICE_FILE = "/tmp/workspace/startup_notice_state.json"
STARTUP_NOTICE_DEDUPE_S = 15 * 60


def send_startup_notice_once(message: str, **kwargs):
    """Suppress duplicate startup notices during rapid restarts/redeploys."""
    now = time.time()
    try:
        state = load_json(STARTUP_NOTICE_FILE, {"last_sent_ts": 0})
        last = float(state.get("last_sent_ts", 0) or 0) if isinstance(state, dict) else 0.0
        if now - last < STARTUP_NOTICE_DEDUPE_S:
            print(f"[STARTUP] Duplicate startup notice suppressed ({int(now - last)}s since last)")
            return False
        save_json(STARTUP_NOTICE_FILE, {"last_sent_ts": now})
    except Exception as e:
        print(f"[STARTUP] Dedupe state unavailable: {e}")
    send_to_personal_only(message, **kwargs)
    return True

'''
          if marker not in s:
              raise SystemExit('Personal-send function marker not found')
          s = s.replace(marker, helper + marker, 1)

          old_send = '    send_to_personal_only(start_msg, parse_mode="Markdown")'
          if old_send not in s:
              raise SystemExit('Startup notification call not found')
          s = s.replace(old_send, '    send_startup_notice_once(start_msg, parse_mode="Markdown")', 1)
          main.write_text(s, encoding='utf-8')

          dash = Path('dashboard/index.html')
          d = dash.read_text(encoding='utf-8')
          mobile = '@media(max-width:820px){body{padding-bottom:'
          if mobile not in d:
              raise SystemExit('Dashboard mobile media query not found')
          d = d.replace(mobile, '@media(max-width:820px){.nav{display:none}body{padding-bottom:', 1)
          dash.write_text(d, encoding='utf-8')

      - name: Verify Phase 1 invariants
        shell: python
        run: |
          from pathlib import Path
          s = Path('main.py').read_text(encoding='utf-8')
          assert 'MAX_SIGNAL_AGE_HOURS = 1' in s
          assert 'send_startup_notice_once(start_msg' in s
          d = Path('dashboard/index.html').read_text(encoding='utf-8')
          assert '@media(max-width:820px){.nav{display:none}' in d
          print('Phase 1 invariants OK')

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/phase1-fix.yml
          git add main.py dashboard/index.html .github/workflows/phase1-fix.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: apply phase 1 fixes"
          git push
