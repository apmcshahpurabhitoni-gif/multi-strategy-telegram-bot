name: Phase 1 theme hard fallback

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install hard fallback in dashboard source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dashboard/index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- phase1-theme-hard-fallback-v1 -->'
          if marker not in s:
              s=s.replace('<button class="icon-btn" id="themeBtn" title="Theme">◐</button>', '<button type="button" class="icon-btn" id="themeBtn" title="Theme" onclick="window.__mavisThemeToggle&&window.__mavisThemeToggle(event)">◐</button>', 1)
              s=s.replace('<button class="theme-choice" data-theme="neo-light">Neo Light</button>', '<button type="button" class="theme-choice" data-theme="neo-light" onclick="window.__mavisSetTheme&&window.__mavisSetTheme(\'neo-light\',event)">Neo Light</button>', 1)
              s=s.replace('<button class="theme-choice" data-theme="neo-dark">Neo Dark</button>', '<button type="button" class="theme-choice" data-theme="neo-dark" onclick="window.__mavisSetTheme&&window.__mavisSetTheme(\'neo-dark\',event)">Neo Dark</button>', 1)
              js='''\n<script id="phase1-theme-hard-fallback-v1">\n(function(){\n  function theme(t){\n    var root=document.documentElement;\n    root.setAttribute("data-theme",t);\n    try{localStorage.setItem("mavis-theme",t)}catch(e){}\n    var b=document.getElementById("themeBtn"),p=document.getElementById("themePop");\n    document.querySelectorAll(".theme-choice").forEach(function(x){x.classList.toggle("active",x.getAttribute("data-theme")===t)});\n    if(p){p.classList.add("open")}\n    if(b)b.setAttribute("aria-expanded","true");\n  }\n  window.__mavisThemeToggle=function(e){\n    if(e){e.preventDefault();e.stopPropagation();}\n    var p=document.getElementById("themePop"),b=document.getElementById("themeBtn");\n    if(!p)return;\n    var open=!p.classList.contains("open");\n    p.classList.toggle("open",open);\n    if(b)b.setAttribute("aria-expanded",String(open));\n  };\n  window.__mavisSetTheme=function(t,e){\n    if(e){e.preventDefault();e.stopPropagation();}\n    theme(t);\n  };\n  document.querySelectorAll(".swatch").forEach(function(x){\n    if(!x.getAttribute("onclick"))x.setAttribute("onclick", "window.__mavisSetAccent&&window.__mavisSetAccent('"+x.getAttribute("data-accent")+"',event)");\n  });\n  window.__mavisSetAccent=function(a,e){\n    if(e){e.preventDefault();e.stopPropagation();}\n    document.documentElement.setAttribute("data-accent",a);\n    try{localStorage.setItem("mavis-accent",a)}catch(x){}\n    document.querySelectorAll(".swatch").forEach(function(x){x.classList.toggle("active",x.getAttribute("data-accent")===a)});\n  };\n})();\n</script>\n'''
              s=s.replace('</body>', marker+js+'</body>', 1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/index.html
          git commit -m 'fix: phase1 theme hard fallback' || exit 0
          git push
          rm .github/workflows/phase1-theme-hard-fallback.yml
          git add .github/workflows/phase1-theme-hard-fallback.yml
          git commit -m 'chore: remove one-time phase1 fallback workflow'
          git push
