name: Phase 4 Runtime Persistence Migration

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_phase4_runtime_bridge.py'
      - 'db.py'
      - 'main.py'
      - 'tests/**'
      - '.github/workflows/phase4-runtime-migration.yml'

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: ${{ !contains(github.event.head_commit.message, 'Phase 4 runtime bridge applied safely') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply guarded migration
        run: python tools/apply_phase4_runtime_bridge.py

      - name: Compile changed runtime files
        run: python -m py_compile main.py db.py

      - name: Run Phase 4 persistence tests
        run: python -m pytest -q tests/test_trade_persistence_phase4.py

      - name: Commit only after verification passes
        run: |
          if git diff --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py db.py
          git commit -m 'Phase 4 runtime bridge applied safely'
          git push origin HEAD:main
