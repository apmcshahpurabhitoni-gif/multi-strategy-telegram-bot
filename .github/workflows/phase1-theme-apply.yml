name: Phase 1 Theme Apply
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated theme controller
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dashboard/index.html')
          s=p.read_text(encoding='utf-8')
          marker='mavis-phase1-direct-theme-controller'
          if marker not in s:
              controller=r'''<style id="mavis-phase1-direct-theme-controller">.theme-box{position:relative;z-index:1000}.theme-pop{z-index:1001!important;pointer-events:auto!important;touch-action:manipulation}@media(max-width:820px){.theme-pop{position:fixed!important;right:12px!important;top:64px!important;width:min(285px,calc(100vw - 24px))!important;z-index:99999!important}}</style><script id="mavis-phase1-direct-theme-controller">(function(){function boot(){var b=document.getElementById('themeBtn'),p=document.getElementById('themePop');if(!b||!p)return false;function toggle(e){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();var o=!p.classList.contains('open');p.classList.toggle('open',o);b.setAttribute('aria-expanded',String(o))}b.addEventListener('click',toggle,true);b.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation()},true);p.addEventListener('click',function(e){var c=e.target.closest('.theme-choice');if(!c)return;e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();var t=c.dataset.theme==='neo-dark'?'neo-dark':'neo-light';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('mavis-theme',t)}catch(x){}p.classList.add('open');b.setAttribute('aria-expanded','true');document.querySelectorAll('.theme-choice').forEach(function(x){x.classList.toggle('active',x.dataset.theme===t)})},true);document.addEventListener('click',function(e){if(!e.target.closest('.theme-box')){p.classList.remove('open');b.setAttribute('aria-expanded','false')}},true);return true}if(!boot())document.addEventListener('DOMContentLoaded',boot,{once:true})})();</script>'''
              s=s.replace('</body>',controller+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/index.html
          git commit -m 'fix: apply isolated phase 1 theme controller' || true
          git push || true
