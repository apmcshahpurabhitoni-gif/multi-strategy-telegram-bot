# One-time migration trigger: canonical signal history + dashboard date archive.
name: Fix signal history

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: fix signal history source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch signal history
        shell: python
        run: |
          from pathlib import Path

          p = Path('sweep_runtime.py')
          s = p.read_text(encoding='utf-8')
          if 'SIGNAL_HISTORY_FILE' not in s:
              s = s.replace('STATE_FILE = "/tmp/workspace/sweep_runtime_state.json"\n', 'STATE_FILE = "/tmp/workspace/sweep_runtime_state.json"\nSIGNAL_HISTORY_FILE = "/tmp/workspace/signal_history.json"\n')
          if 'def _save_signal_event(' not in s:
              marker = 'def _key(symbol, close_ts):\n'
              fn = '''def _save_signal_event(symbol, mtype, result):\n    """Persist every confirmed sweep signal; dashboard history never expires."""\n    try:\n        os.makedirs(os.path.dirname(SIGNAL_HISTORY_FILE), exist_ok=True)\n        try:\n            with open(SIGNAL_HISTORY_FILE, "r", encoding="utf-8") as f:\n                rows = json.load(f)\n        except Exception:\n            rows = []\n        if not isinstance(rows, list):\n            rows = []\n        close_ts = int(result.candle_end.timestamp() * 1000)\n        event_id = _key(symbol, close_ts)\n        if any(isinstance(x, dict) and x.get("id") == event_id for x in rows):\n            return\n        rows.append({"id": event_id, "symbol": symbol, "market": mtype, "direction": result.direction, "strategy": f"{result.timeframe} Sweep", "timeframe": result.timeframe, "candle_start": result.candle_start.isoformat(), "candle_end": result.candle_end.isoformat(), "created_at": datetime.now().astimezone().isoformat(), "reminder_sent": False, "candle_end_ms": close_ts})\n        rows.sort(key=lambda x: int(x.get("candle_end_ms", 0) or 0), reverse=True)\n        with open(SIGNAL_HISTORY_FILE + ".tmp", "w", encoding="utf-8") as f:\n            json.dump(rows, f, indent=2)\n        os.replace(SIGNAL_HISTORY_FILE + ".tmp", SIGNAL_HISTORY_FILE)\n    except Exception as e:\n        print("[SWEEP] signal history save:", e)\n\n\n'''
              s = s.replace(marker, fn + marker)
          old = '        _save(); CONTEXT[key] = result\n        if direction == "NEUTRAL":\n'
          new = '        _save(); CONTEXT[key] = result\n        _save_signal_event(symbol, mtype, result)\n        if direction == "NEUTRAL":\n'
          if old not in s:
              raise SystemExit('sweep_runtime.py: expected signal persistence anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('dashboard_api.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('def _build_actual_signals(')
          end = s.index('\n\ndef _build_snapshot()', start)
          fn = '''def _build_actual_signals(main, ist, cutoff=None):\n    """Read permanent signal history. One-hour duplicate control is Telegram-only."""\n    rows = _load_file(main, "/tmp/workspace/signal_history.json", [])\n    if not isinstance(rows, list):\n        return []\n    signals = []\n    for record in rows:\n        if not isinstance(record, dict):\n            continue\n        ts = _parse_ts(record.get("candle_end"), 0)\n        symbol = str(record.get("symbol") or "").strip()\n        if not symbol or not ts:\n            continue\n        dt = datetime.fromtimestamp(ts / 1000, tz=ist)\n        signals.append({"id": record.get("id", f"{symbol}:{ts}"), "time": dt.strftime("%d-%b %H:%M"), "sym": symbol, "dir": _direction(record.get("direction")), "strategy": record.get("strategy") or f"{record.get('timeframe', '4H')} Sweep", "status": "REMINDER SENT" if record.get("reminder_sent") else "SIGNAL", "pnl": 0, "hint": "Confirmed sweep signal", "ts_ms": ts, "reminder": bool(record.get("reminder_sent")), "date": dt.strftime("%Y-%m-%d")})\n    signals.sort(key=lambda x: x["ts_ms"], reverse=True)\n    return signals\n'''
          s = s[:start] + fn + s[end:]
          old = '    # Your rule: a signal is valid on the dashboard for one hour after the closed candle.\n    cutoff = int(time.time() * 1000) - 60 * 60 * 1000\n    signals = _build_actual_signals(main, IST, cutoff)\n'
          new = '    # Dashboard signal history is permanent; one-hour rule applies only to Telegram duplicate control.\n    signals = _build_actual_signals(main, IST)\n'
          if old not in s:
              raise SystemExit('dashboard_api.py: one-hour dashboard cutoff anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          Path('.github/workflows/fix-signal-history.yml').unlink()

      - name: Verify before commit
        shell: python
        run: |
          import ast
          from pathlib import Path
          for name in ('sweep_runtime.py', 'dashboard_api.py'):
              ast.parse(Path(name).read_text(encoding='utf-8'))
          s = Path('sweep_runtime.py').read_text(encoding='utf-8')
          d = Path('dashboard_api.py').read_text(encoding='utf-8')
          assert 'SIGNAL_HISTORY_FILE' in s and '_save_signal_event' in s
          assert 'signal_history.json' in d and 'Dashboard signal history is permanent' in d
          assert '60 * 60 * 1000' not in d
          print('PASS: signal history migration syntax and invariants verified')

      - name: Commit verified migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sweep_runtime.py dashboard_api.py .github/workflows/fix-signal-history.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore: fix signal history source'
          git push