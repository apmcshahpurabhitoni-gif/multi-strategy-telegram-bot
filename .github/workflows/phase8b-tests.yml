name: Phase 8B Tests

on:
  push:
    branches: ["main", "phase-8-signal-trade-intelligence"]
  pull_request:
    branches: ["main", "baseline-approved-2026-08-26-final"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Python syntax
        run: python -m compileall -q phase8_intelligence.py phase8_dashboard.py dashboard_api.py tests

      - name: Phase 8A/8B tests
        run: python -m pytest -q tests/test_phase8_intelligence.py tests/test_phase8b_dashboard.py

      - name: Dashboard JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("templates/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          assert scripts, "dashboard script missing"
          Path("/tmp/dashboard.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/dashboard.js

      - name: Dashboard smoke source checks
        run: |
          grep -q 'from phase8_intelligence import build_intelligence' dashboard_api.py
          grep -q 'from phase8_dashboard import build_dashboard_intelligence' dashboard_api.py
          grep -q 'intelligence' dashboard_api.py
          grep -q 'build_dashboard_intelligence' dashboard_api.py
          grep -q '/api/dashboard' templates/index.html
          grep -q 'trade_details' templates/index.html
          grep -q 'equity_points' templates/index.html
