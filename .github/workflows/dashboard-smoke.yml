name: Dashboard Smoke Test

on:
  push:
    branches: ["main", "phase-6"]
  pull_request:
    branches: ["main"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax
        run: python -m compileall -q .

      - name: Dashboard HTML and JavaScript smoke test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("templates/index.html").read_text(encoding="utf-8")
          for label in ("Modern Light", "Modern Dark", "Neo-Brutalist Light", "Neo-Brutalist Dark"):
              assert label in html, f"missing theme: {label}"
          for marker in ("/api/dashboard", "/api/backtest?", "function sortDateKeys(keys)", "function normalizeBacktest(raw)", "function drawBacktestCurve(points)", "function renderBacktestDetails(bt)"):
              assert marker in html, f"missing dashboard marker: {marker}"
          assert "Today first · future next · past last" in html, "news ordering marker missing"
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          assert scripts, "dashboard script missing"
          Path("/tmp/dashboard.js").write_text(scripts[-1], encoding="utf-8")
          print("dashboard smoke source checks passed")
          PY
          node --check /tmp/dashboard.js
          echo "dashboard JavaScript syntax passed"

      - name: Dashboard endpoint wiring checks
        run: |
          grep -q '/api/dashboard' templates/index.html
          grep -q '/api/backtest?' templates/index.html
          grep -q 'trade_details' templates/index.html
          grep -q 'equity_points' templates/index.html
          echo "dashboard endpoint wiring passed"
