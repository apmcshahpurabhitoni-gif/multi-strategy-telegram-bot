name: Phase 3 mobile dashboard fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard and remove one-time workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dashboard/index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.theme-box{position:relative}.theme-pop{display:none;position:absolute;right:0;top:46px;width:285px;padding:12px;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow2);border-radius:12px;z-index:80}.theme-box.open .theme-pop{display:block}'
          new_css = old_css + '@media(max-width:820px){.theme-pop{position:fixed;right:12px;top:76px;width:min(285px,calc(100vw - 24px));max-height:calc(100vh - 96px);overflow:auto;z-index:120}}'
          if old_css not in s:
              raise SystemExit('theme CSS anchor not found')
          s = s.replace(old_css, new_css, 1)

          old_mobile = '.account{grid-template-columns:auto 1fr;gap:8px;padding:9px}.account-pills{display:none}'
          new_mobile = '.account{grid-template-columns:auto 1fr;gap:8px;padding:9px}.account-pills{display:flex;grid-column:1/-1;justify-content:flex-start}'
          if old_mobile not in s:
              raise SystemExit('mobile account CSS anchor not found')
          s = s.replace(old_mobile, new_mobile, 1)

          old_js = "buildNav();applyPrefs();$('themeBtn').onclick=()=>$('themePop').classList.toggle('open');$('refreshBtn').onclick=()=>loadSnapshot();document.addEventListener('click',e=>{if(!e.target.closest('.theme-box'))$('themePop').classList.remove('open')});document.querySelectorAll('.theme-choice').forEach(b=>b.onclick=()=>{localStorage.setItem('mavis-theme',b.dataset.theme);applyPrefs()});document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{localStorage.setItem('mavis-accent',b.dataset.accent);applyPrefs()});"
          new_js = "buildNav();applyPrefs();const themeBtn=$('themeBtn'),themePop=$('themePop');themeBtn.type='button';themeBtn.setAttribute('aria-expanded','false');themeBtn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const open=!themePop.classList.contains('open');themePop.classList.toggle('open',open);themeBtn.setAttribute('aria-expanded',String(open))});$('refreshBtn').onclick=()=>loadSnapshot();document.addEventListener('click',e=>{if(!e.target.closest('.theme-box')){themePop.classList.remove('open');themeBtn.setAttribute('aria-expanded','false')}});document.querySelectorAll('.theme-choice').forEach(b=>b.onclick=()=>{localStorage.setItem('mavis-theme',b.dataset.theme);applyPrefs();themePop.classList.remove('open');themeBtn.setAttribute('aria-expanded','false')});document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{localStorage.setItem('mavis-accent',b.dataset.accent);applyPrefs()});"
          if old_js not in s:
              raise SystemExit('theme JS anchor not found')
          s = s.replace(old_js, new_js, 1)

          marker = '<!-- phase3-mobile-dashboard-fix -->'
          if marker not in s:
              s = s.replace('</head>', marker + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/index.html
          git rm .github/workflows/phase3-mobile-dashboard-fix.yml
          git commit -m "fix: repair mobile theme and account overview UI"
          git push
