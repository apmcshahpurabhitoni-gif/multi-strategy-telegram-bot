name: phase8b-apply-once
on:
  push:
    branches: [phase-8-signal-trade-intelligence]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical 8B integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          api = Path('dashboard_api.py')
          s = api.read_text()
          if 'from phase8_intelligence import build_intelligence' not in s:
              s = s.replace('import pytz\n', 'import pytz\nfrom phase8_intelligence import build_intelligence\nfrom phase8_dashboard import build_dashboard_intelligence\n', 1)
          if '"intelligence":intelligence_payload' not in s:
              needle = '    total_balance=round(sum(float(a.get("balance",0) or 0) for a in accounts.values() if isinstance(a,dict)),2)\n'
              insert = needle + '    intelligence_payload=build_dashboard_intelligence(build_intelligence(history, signals))\n'
              if needle not in s: raise SystemExit('dashboard_api anchor missing')
              s = s.replace(needle, insert, 1)
              needle2 = '"total_pnl":round(total,2)}'
              if needle2 not in s: raise SystemExit('dashboard_api return anchor missing')
              s = s.replace(needle2, '"total_pnl":round(total,2),"intelligence":intelligence_payload}', 1)
          api.write_text(s)

          html = Path('templates/index.html')
          s = html.read_text()
          css_anchor = '.signal-status{font-size:8px;color:var(--muted);margin-top:4px}'
          if '.intel-grid{' not in s:
              css = css_anchor + '.intel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.intel-box{padding:8px;border:var(--border) solid var(--line);border-radius:9px;background:var(--soft)}.intel-box b{display:block;font-size:8px;color:var(--muted);text-transform:uppercase}.intel-box strong{font-size:11px;display:block;margin-top:2px}.intel-explain{font-size:9px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}.strategy-card{padding:10px;margin:6px 0;border:var(--border) solid var(--line);border-radius:9px;background:var(--soft)}.strategy-head{display:flex;justify-content:space-between;gap:8px}.strategy-name{font-size:11px;font-weight:900}.strategy-pnl{font-size:10px;font-weight:900}.strategy-meta{font-size:8px;color:var(--muted);margin-top:4px}.strategy-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}.strategy-metric{padding:6px;border:1px solid var(--line);border-radius:7px}.strategy-metric b{display:block;font-size:7px;color:var(--muted);text-transform:uppercase}.strategy-metric span{font-size:9px;font-weight:900}.unavailable{color:var(--muted);font-weight:700}'
              s = s.replace(css_anchor, css, 1)
          if 'id="strategyCards"' not in s:
              marker = '<div class="card box" style="margin-top:8px"><div class="section"><h2><span class="section-icon">▣</span>Latest Backtest</h2>'
              section = '<div class="card box" style="margin-top:8px"><div class="section"><h2><span class="section-icon">◈</span>Strategy Intelligence</h2><span class="muted">Recorded closed-trade performance</span></div><div id="strategyCards"><div class="empty">Loading…</div></div></div>' + marker
              if marker not in s: raise SystemExit('template overview anchor missing')
              s = s.replace(marker, section, 1)

          old_signal = 'function signalCard(x){var d=dir(x.dir||x.direction),cls=dirClass(d),stamp=x.ts_ms?dateTimeLabel(x.time,x.ts_ms):(x.time||"");return\'<div class="signal-card"><div class="signal-main"><div><div class="signal-symbol">\'+esc(x.sym||x.symbol||"—")+\'</div><div class="signal-meta">\'+esc(x.strategy||"Sweep")+\' · \'+esc(stamp)+\'</div></div><div class="signal-right"><span class="signal-dir \'+cls+\'">\'+d+\'</span><div class="signal-status">\'+esc(x.status||"SIGNAL SAVED")+\'</div></div></div></div>\'}'
          if old_signal not in s: raise SystemExit('signalCard anchor missing')
          new_signal = 'function signalCard(x){var d=dir(x.dir||x.direction),cls=dirClass(d),stamp=x.ts_ms?dateTimeLabel(x.time,x.ts_ms):(x.time||""),hint=x.explanation||x.hint||"Recorded signal metadata only; no inferred reason.";return\'<div class="signal-card"><div class="signal-main"><div><div class="signal-symbol">\'+esc(x.sym||x.symbol||"—")+\'</div><div class="signal-meta">\'+esc(x.strategy||"Sweep")+\' · \'+esc(stamp)+\'</div></div><div class="signal-right"><span class="signal-dir \'+cls+\'">\'+d+\'</span><div class="signal-status">\'+esc(x.status||"SIGNAL SAVED")+\'</div></div></div><div class="intel-explain">\'+esc(hint)+\'</div></div>\'}'
          s = s.replace(old_signal, new_signal, 1)

          if 'function renderStrategyCards(cards)' not in s:
              anchor = 'function renderLatest(list){return(list||[]).slice(0,3).map(signalCard).join("")||\'<div class="empty">No saved signals yet.</div>\'}'
              fn = anchor + 'function intelValue(v,formatter){return v==null?\'<span class="unavailable">Unavailable</span>\':esc(formatter?formatter(v):String(v))}function renderStrategyCards(cards){if(!cards||!cards.length)return\'<div class="empty">No closed-trade strategy data available.</div>\';return cards.map(function(x){var p=Number(x.pnl_inr||0);return\'<div class="strategy-card"><div class="strategy-head"><span class="strategy-name">\'+esc(x.strategy||"Unknown")+\'</span><span class="strategy-pnl \'+(p>=0?"buy":"sell")+\'">\'+esc(pnl(p))+\'</span></div><div class="strategy-meta">\'+esc(x.trades)+\' trades · \'+esc(x.wins)+\' wins · \'+esc(x.losses)+\' losses · \'+esc(x.flat)+\' flat</div><div class="strategy-metrics"><div class="strategy-metric"><b>Win Rate</b><span>\'+intelValue(x.win_rate_pct,function(v){return Number(v).toFixed(2)+"%"})+\'</span></div><div class="strategy-metric"><b>Expectancy</b><span>\'+intelValue(x.expectancy_inr,function(v){return pnl(v)})+\'</span></div><div class="strategy-metric"><b>Profit Factor</b><span>\'+intelValue(x.profit_factor,function(v){return Number(v).toFixed(2)})+\'</span></div><div class="strategy-metric"><b>Avg Win</b><span>\'+intelValue(x.avg_win_inr,function(v){return pnl(v)})+\'</span></div></div></div>\'}).join("")}'
              if anchor not in s: raise SystemExit('renderLatest anchor missing')
              s = s.replace(anchor, fn, 1)

          old_load = 'document.getElementById("newsList").innerHTML=renderNews(data.news||data.news_raw||[]);var saved=null;'
          if old_load not in s: raise SystemExit('loadDashboard anchor missing')
          new_load = 'document.getElementById("newsList").innerHTML=renderNews(data.news||data.news_raw||[]);var intelligence=data.intelligence||{};document.getElementById("strategyCards").innerHTML=renderStrategyCards(intelligence.strategies||[]);var saved=null;'
          s = s.replace(old_load, new_load, 1)
          html.write_text(s)

          # Remove this one-shot workflow from the resulting tree.
          wf = Path('.github/workflows/_phase8b_apply.yml')
          if wf.exists(): wf.unlink()
          PY
      - name: Commit generated Phase 8B integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard_api.py templates/index.html .github/workflows/_phase8b_apply.yml
          git commit -m 'phase 8b: integrate dashboard intelligence' || exit 0
          git push
