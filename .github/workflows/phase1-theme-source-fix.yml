name: Phase 1 theme source fix
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'fix: rebuild theme control in dashboard source')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace theme implementation in source
        shell: python
        run: |
          from pathlib import Path
          p = Path('dashboard/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* mavis-phase1-theme-source */'
          if marker not in s:
              s = s.replace('.theme-box{position:relative}', '.theme-box{position:relative;z-index:200}.theme-box,#themeBtn{touch-action:manipulation;-webkit-tap-highlight-color:transparent}', 1)
              s = s.replace('</style>', marker + '</style>', 1)
          start = s.find('function applyPrefs(){')
          end = s.find('buildNav();', start)
          if start < 0 or end < 0:
              raise SystemExit('theme initialization anchors not found')
          replacement = r'''function getTheme(){try{return localStorage.getItem('mavis-theme')||'neo-light'}catch(_){return 'neo-light'}}
function getAccent(){try{return localStorage.getItem('mavis-accent')||'emerald'}catch(_){return 'emerald'}}
function setPref(k,v){try{localStorage.setItem(k,v)}catch(_){} }
function applyPrefs(){const t=getTheme(),a=getAccent();const root=document.documentElement;root.dataset.theme=t;root.dataset.accent=a;const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=t==='neo-dark'?'#0d0f14':'#f3eddc';document.querySelectorAll('.theme-choice').forEach(x=>x.classList.toggle('active',x.dataset.theme===t));document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x.dataset.accent===a))}
function toggleThemeMenu(force){const box=document.querySelector('.theme-box'),pop=$('themePop'),btn=$('themeBtn');if(!box||!pop||!btn)return;const open=force===undefined?!box.classList.contains('open'):!!force;box.classList.toggle('open',open);pop.hidden=!open;btn.setAttribute('aria-expanded',String(open))}
function initTheme(){const btn=$('themeBtn'),pop=$('themePop');if(!btn||!pop)return;btn.type='button';btn.setAttribute('aria-haspopup','true');btn.setAttribute('aria-expanded','false');pop.hidden=true;const activate=e=>{if(e){e.preventDefault();e.stopPropagation()}toggleThemeMenu()};btn.addEventListener('pointerup',activate,{capture:true});btn.addEventListener('click',activate,{capture:true});document.addEventListener('pointerdown',e=>{if(!e.target.closest('.theme-box'))toggleThemeMenu(false)},true);document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleThemeMenu(false)});document.querySelectorAll('.theme-choice').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();setPref('mavis-theme',b.dataset.theme);applyPrefs();toggleThemeMenu(false)}));document.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();setPref('mavis-accent',b.dataset.accent);applyPrefs()}));applyPrefs()}
'''
          s = s[:start] + replacement + s[end:]
          if 'initTheme();' not in s:
              s = s.replace('buildNav();applyPrefs();', 'buildNav();initTheme();', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit source-only fix and remove this workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/index.html
          git rm -f .github/workflows/phase1-theme-source-fix.yml
          git commit -m "fix: rebuild theme control in dashboard source"
          git push
