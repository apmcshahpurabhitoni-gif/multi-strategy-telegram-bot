name: Sweep Engine Tests

on:
  push:
    branches: [main, fix/sweep-engine-v2, phase-6]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sweep-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Apply guarded Phase 4 runtime bridge
        run: python tools/apply_phase4_runtime_bridge.py
      - name: Compile runtime files
        run: python -m py_compile main.py db.py
      - name: Run Phase 4 persistence tests
        run: python -m pytest -q tests/test_trade_persistence_phase4.py
      - name: Run sweep tests
        run: python -m pytest -q tests/test_sweep_v23.py
      - name: Commit Phase 4 migration only after tests pass
        run: |
          if git diff --quiet; then
            echo "No Phase 4 migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py db.py
          git commit -m "Phase 4 runtime bridge applied safely"
          git push origin HEAD:main
