name: Sweep Engine Tests

on:
  push:
    branches: [main, audit/canonical-bot-cleanup, fix/sweep-engine-v2, phase-6]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sweep-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile runtime files
        run: python -m py_compile main.py db.py sweep_engine.py sweep_freshness.py canonical_sweep_adapter.py canonical_backtest.py
      - name: Run Phase 4 persistence tests
        run: python -m pytest -q tests/test_trade_persistence_phase4.py
      - name: Run Sweep V2 tests
        run: python -m pytest -q tests/test_sweep_v23.py
      - name: Run canonical backtest equivalence tests
        run: python -m pytest -q tests/test_canonical_backtest.py
      - name: Run freshness policy tests
        run: python -m pytest -q tests/test_sweep_freshness.py
