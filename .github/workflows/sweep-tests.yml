name: Sweep Engine Tests

on:
  push:
    branches: [main, fix/sweep-engine-v2, phase-6, phase-10-production]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sweep-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile runtime files
        run: python -m py_compile main.py db.py sweep_engine.py sweep_runtime.py
      - name: Run Phase 4 persistence tests
        run: python -m pytest -q tests/test_trade_persistence_phase4.py
      - name: Run sweep tests
        run: python -m pytest -q tests/test_sweep_v23.py tests/test_sweep_engine.py
