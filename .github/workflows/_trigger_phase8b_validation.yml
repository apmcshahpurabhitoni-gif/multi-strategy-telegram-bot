name: phase8b-validation-trigger
on:
  push:
    branches: [phase-8-signal-trade-intelligence]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary trigger
        run: |
          rm -f .github/workflows/_trigger_phase8b_validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/_trigger_phase8b_validation.yml
          git commit -m 'chore: remove temporary CI trigger'
          git push
