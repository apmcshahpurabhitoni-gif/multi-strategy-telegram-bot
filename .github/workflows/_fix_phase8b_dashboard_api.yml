name: phase8b-fix-dashboard-api
on:
  push:
    branches: [phase-8-signal-trade-intelligence]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal Phase 8B dashboard API integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          api = Path('dashboard_api.py')
          s = api.read_text(encoding='utf-8')

          import_anchor = 'import pytz\n'
          imports = 'import pytz\nfrom phase8_intelligence import build_intelligence\nfrom phase8_dashboard import build_dashboard_intelligence\n'
          if 'from phase8_intelligence import build_intelligence' not in s:
              if import_anchor not in s:
                  raise SystemExit('dashboard_api import anchor missing')
              s = s.replace(import_anchor, imports, 1)

          payload_marker = '"intelligence":intelligence_payload'
          if payload_marker not in s:
              balance_anchor = '    total_balance=round(sum(float(a.get("balance",0) or 0) for a in accounts.values() if isinstance(a,dict)),2)\n'
              if balance_anchor not in s:
                  raise SystemExit('dashboard_api balance anchor missing')
              s = s.replace(balance_anchor, balance_anchor + '    intelligence_payload=build_dashboard_intelligence(build_intelligence(history, signals))\n', 1)

              return_anchor = '"total_pnl":round(total,2)}'
              if return_anchor not in s:
                  raise SystemExit('dashboard_api return anchor missing')
              s = s.replace(return_anchor, '"total_pnl":round(total,2),"intelligence":intelligence_payload}', 1)

          api.write_text(s, encoding='utf-8')
          PY
      - name: Commit minimal fix and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/_fix_phase8b_dashboard_api.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard_api.py .github/workflows/_fix_phase8b_dashboard_api.yml
          git commit -m 'fix: complete Phase 8B dashboard API integration'
          git push
