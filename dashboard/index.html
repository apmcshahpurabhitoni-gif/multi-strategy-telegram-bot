<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e1a" />
<title>Mavis · Trade Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg-0:        #07090f;
    --bg-1:        #0a0e1a;
    --bg-2:        #0f1424;
    --surface:     #131a2c;
    --surface-2:   #18203a;
    --surface-3:   #1f2840;
    --line:        rgba(255, 255, 255, 0.06);
    --line-2:      rgba(255, 255, 255, 0.10);
    --line-3:      rgba(255, 255, 255, 0.16);
    --text-1:      #e8ecf5;
    --text-2:      #9aa3b8;
    --text-3:      #5d6477;
    --text-4:      #3f4554;
    --green:       #00d68f;
    --green-soft:  rgba(0, 214, 143, 0.12);
    --green-line:  rgba(0, 214, 143, 0.28);
    --red:         #ff4d6a;
    --red-soft:    rgba(255, 77, 106, 0.12);
    --red-line:    rgba(255, 77, 106, 0.28);
    --blue:        #4d9eff;
    --blue-soft:   rgba(77, 158, 255, 0.12);
    --blue-line:   rgba(77, 158, 255, 0.28);
    --amber:       #ffb547;
    --amber-soft:  rgba(255, 181, 71, 0.12);
    --amber-line:  rgba(255, 181, 71, 0.28);
    --violet:      #a78bfa;
    --violet-soft: rgba(167, 139, 250, 0.12);
    --violet-line: rgba(167, 139, 250, 0.28);
    --font-sans: 'Outfit', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --tnum:      tabular-nums;
    --r-sm:  8px;
    --r-md:  12px;
    --r-lg:  16px;
    --r-xl:  20px;
    --r-2xl: 24px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(77, 158, 255, 0.05), transparent 60%),
      var(--bg-1);
    color: var(--text-1);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.003em;
    min-height: 100vh;
  }
  ::selection { background: rgba(77, 158, 255, 0.35); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .app { max-width: 1480px; margin: 0 auto; padding: 16px 16px 64px; }
  @media (min-width: 768px) { .app { padding: 20px 24px 64px; } }
  @media (min-width: 1280px) { .app { padding: 24px 32px 80px; } }

  /* ===================== TOPBAR ===================== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 14px;
    background: linear-gradient(180deg, rgba(19, 26, 44, 0.7) 0%, rgba(19, 26, 44, 0.4) 100%);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    margin-bottom: 16px;
    position: sticky; top: 8px; z-index: 50;
  }
  @media (min-width: 768px) { .topbar { padding: 14px 20px; } }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: var(--r-md);
    background: linear-gradient(135deg, #4d9eff 0%, #00d68f 100%);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(77, 158, 255, 0.25), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .brand-mark svg { color: #0a0e1a; }
  .brand-text { min-width: 0; }
  .brand-text h1 {
    font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -0.01em;
    color: var(--text-1);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .brand-text .sub {
    font-size: 10px; color: var(--text-3); font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.12em; margin-top: 1px;
  }
  @media (max-width: 640px) { .brand-text .sub { display: none; } }

  .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
    border: 1px solid;
  }
  .status-pill.s-live   { background: var(--green-soft); border-color: var(--green-line); color: var(--green); }
  .status-pill.s-stale  { background: var(--amber-soft); border-color: var(--amber-line); color: var(--amber); }
  .status-pill.s-demo   { background: var(--blue-soft);  border-color: var(--blue-line);  color: var(--blue); }
  .status-pill.s-error  { background: var(--red-soft);   border-color: var(--red-line);   color: var(--red); }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    box-shadow: 0 0 6px currentColor;
  }
  .status-pill.s-live .status-dot  { background: var(--green); animation: pulse 1.6s infinite; }
  .status-pill.s-stale .status-dot { background: var(--amber); }
  .status-pill.s-demo .status-dot  { background: var(--blue);  animation: pulse 1.6s infinite; }
  .status-pill.s-error .status-dot { background: var(--red);   animation: pulse 1.0s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }

  .clock { font-size: 11px; color: var(--text-2); font-weight: 500;
    font-family: var(--font-mono); letter-spacing: 0; white-space: nowrap; }
  .clock b { color: var(--text-1); font-weight: 600; }
  .clock .updated { color: var(--text-3); margin-left: 4px; }
  @media (max-width: 480px) { .clock { display: none; } }

  .icon-btn {
    width: 34px; height: 34px; border-radius: var(--r-md);
    background: var(--surface); border: 1px solid var(--line);
    color: var(--text-2); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.18s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text-1); border-color: var(--line-2); }
  .icon-btn.spinning svg { animation: spin 0.6s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===================== ERROR BANNER ===================== */
  .error-banner {
    background: var(--red-soft);
    border: 1px solid var(--red-line);
    color: var(--red);
    padding: 10px 14px;
    border-radius: var(--r-md);
    margin-bottom: 16px;
    font-size: 12.5px;
    display: flex; align-items: center; gap: 10px;
  }
  .error-banner .retry-btn {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--red-line);
    color: var(--red);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .error-banner .retry-btn:hover { background: var(--red-soft); }

  /* ===================== KPI ===================== */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px; margin-bottom: 16px;
  }
  @media (min-width: 640px) { .kpi-row { grid-template-columns: repeat(3, 1fr); gap: 12px; } }
  @media (min-width: 1024px) { .kpi-row { grid-template-columns: repeat(5, 1fr); } }

  .kpi {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 16px 16px 14px;
    transition: all 0.2s;
    overflow: hidden;
  }
  .kpi:hover { border-color: var(--line-2); background: var(--surface-2); }
  .kpi::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-color, var(--blue)), transparent);
    opacity: 0.5;
  }
  .kpi.accent-green  { --accent-color: var(--green); }
  .kpi.accent-red    { --accent-color: var(--red); }
  .kpi.accent-blue   { --accent-color: var(--blue); }
  .kpi.accent-amber  { --accent-color: var(--amber); }
  .kpi.accent-violet { --accent-color: var(--violet); }

  .kpi-label {
    font-size: 10px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.1em;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .kpi-label .ic { color: var(--accent-color, var(--text-2)); }
  .kpi-value {
    font-size: 22px; font-weight: 600; letter-spacing: -0.025em;
    line-height: 1.1; color: var(--text-1);
  }
  @media (min-width: 1024px) { .kpi-value { font-size: 24px; } }
  .kpi-value.t-green { color: var(--green); }
  .kpi-value.t-red   { color: var(--red); }
  .kpi-delta {
    font-size: 11px; color: var(--text-2); margin-top: 6px;
    display: flex; align-items: center; gap: 4px; font-weight: 500;
  }
  .kpi-delta.pos { color: var(--green); }
  .kpi-delta.neg { color: var(--red); }

  /* ===================== CARDS ===================== */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    overflow: hidden;
  }
  .card-head {
    padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,0.015), transparent);
  }
  @media (min-width: 768px) { .card-head { padding: 16px 20px; } }
  .card-title {
    font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
    text-transform: uppercase; color: var(--text-1);
    display: flex; align-items: center; gap: 8px;
  }
  .card-title .ic { color: var(--text-2); }
  .card-sub { font-size: 11px; color: var(--text-3); font-weight: 500; font-family: var(--font-mono); }

  .grid-2 { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
  @media (min-width: 1024px) {
    .grid-2 { grid-template-columns: 1.4fr 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
  }

  /* ===================== ACCOUNTS ===================== */
  .accounts-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px; margin-bottom: 16px;
  }
  @media (min-width: 768px) { .accounts-row { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
  @media (min-width: 1024px) { .accounts-row { grid-template-columns: repeat(4, 1fr); } }

  .account {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 14px 14px 12px;
    position: relative; overflow: hidden;
    transition: all 0.2s;
  }
  .account:hover { border-color: var(--line-2); background: var(--surface-2); transform: translateY(-1px); }
  .account::after {
    content: ""; position: absolute; top: 0; left: 0; width: 3px; bottom: 0;
    background: var(--accent);
  }
  .account.macro      { --accent: linear-gradient(180deg, #4d9eff, #2563eb); }
  .account.nifty      { --accent: linear-gradient(180deg, #ffb547, #d97706); }
  .account.ny_session { --accent: linear-gradient(180deg, #a78bfa, #7c3aed); }
  .account.sweep_4h   { --accent: linear-gradient(180deg, #00d68f, #059669); }
  .acct-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .acct-name { display: flex; align-items: center; gap: 8px; }
  .acct-icon {
    width: 28px; height: 28px; border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    background: var(--surface-3); color: var(--text-1);
    border: 1px solid var(--line);
  }
  .acct-name-text { font-size: 12px; font-weight: 600; color: var(--text-1); letter-spacing: 0.01em; }
  .acct-name-sub { font-size: 9.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
  .acct-status {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    padding: 3px 7px; border-radius: 999px;
  }
  .acct-status.active { background: var(--green-soft); color: var(--green); }
  .acct-status.inactive { background: rgba(255,255,255,0.04); color: var(--text-3); }
  .acct-balance {
    font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 4px;
    color: var(--text-1);
  }
  .acct-pnl { font-size: 11.5px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .acct-pnl.pos { color: var(--green); }
  .acct-pnl.neg { color: var(--red); }
  .acct-pnl .wk { color: var(--text-3); font-weight: 500; }
  .acct-usage { margin-top: 10px; }
  .acct-usage-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 10.5px; color: var(--text-3); margin-bottom: 5px;
    font-weight: 500;
  }
  .acct-usage-row b { color: var(--text-1); font-weight: 600; font-family: var(--font-mono); }
  .bar-bg { height: 4px; background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width 0.5s ease; }
  .bar-fill.b-green { background: linear-gradient(90deg, #00d68f, #00b377); }
  .bar-fill.b-amber { background: linear-gradient(90deg, #ffb547, #f59e0b); }
  .bar-fill.b-red   { background: linear-gradient(90deg, #ff4d6a, #ef4444); }

  /* ===================== LIVE TRADES ===================== */
  .trades-list { padding: 0; }
  .trade-row { display: none; }
  .trades-table { display: none; }
  .trade-card {
    display: block;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    transition: background 0.15s;
  }
  .trade-card:last-child { border-bottom: none; }
  .trade-card:hover { background: rgba(255,255,255,0.015); }
  .tc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .tc-sym { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .tc-sym .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 1.6s infinite;
  }
  .tc-acct {
    font-size: 9.5px; padding: 3px 7px; border-radius: 4px;
    background: var(--surface-3); color: var(--text-2);
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .tc-pl { margin: 8px 0 10px; }
  .tc-pl .num { font-size: 18px; font-weight: 600; font-family: var(--font-mono); letter-spacing: -0.02em; }
  .tc-pl .pct { font-size: 11px; color: var(--text-3); font-family: var(--font-mono); margin-left: 6px; }
  .tc-num.pos { color: var(--green); }
  .tc-num.neg { color: var(--red); }
  .tc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .tc-cell { font-size: 10.5px; }
  .tc-cell .lbl { color: var(--text-3); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; margin-bottom: 2px; }
  .tc-cell .val { font-family: var(--font-mono); font-size: 12px; color: var(--text-1); }
  .tc-cell.sl .val { color: var(--red); }
  .tc-cell.tp .val { color: var(--green); }
  .tc-progress { margin-top: 8px; }
  .tc-progress .row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 10.5px; color: var(--text-3); margin-bottom: 5px;
    font-family: var(--font-mono);
  }
  .tc-progress .row b { color: var(--text-1); font-weight: 600; }

  .dir-badge {
    font-size: 9.5px; font-weight: 700; padding: 3px 7px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.06em; line-height: 1;
  }
  .dir-badge.long  { background: var(--green-soft); color: var(--green); }
  .dir-badge.short { background: var(--red-soft);   color: var(--red); }

  @media (min-width: 1100px) {
    .trade-card { display: none; }
    .trades-table { display: block; }
    .trades-table thead th {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-3); font-weight: 600; padding: 12px 16px;
      background: var(--bg-2); border-bottom: 1px solid var(--line);
      text-align: left; white-space: nowrap;
    }
    .trades-table thead th.r { text-align: right; }
    .trades-table tbody tr {
      border-bottom: 1px solid var(--line);
      transition: background 0.15s;
    }
    .trades-table tbody tr:hover { background: rgba(255,255,255,0.015); }
    .trades-table tbody tr:last-child { border-bottom: none; }
    .trades-table td { padding: 14px 16px; font-size: 13px; vertical-align: middle; }
  }

  /* Flash animation on price change */
  @keyframes flashUp {
    0% { background: var(--green-soft); }
    100% { background: transparent; }
  }
  @keyframes flashDown {
    0% { background: var(--red-soft); }
    100% { background: transparent; }
  }
  .flash-up   { animation: flashUp 0.8s ease-out; border-radius: 4px; }
  .flash-down { animation: flashDown 0.8s ease-out; border-radius: 4px; }

  /* ===================== SIGNALS ===================== */
  .signals-list { padding: 0; }
  .sig-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    font-size: 12.5px; transition: background 0.15s;
  }
  .sig-item:hover { background: rgba(255,255,255,0.015); }
  .sig-item:last-child { border-bottom: none; }
  @media (min-width: 768px) { .sig-item { padding: 12px 20px; gap: 12px; } }
  .sig-time { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); width: 44px; flex-shrink: 0; }
  .sig-mid { flex: 1; min-width: 0; }
  .sig-row1 { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .sig-sym { font-weight: 600; color: var(--text-1); font-size: 13px; }
  .sig-strat { font-size: 11px; color: var(--text-3); }
  .sig-hint { font-size: 10.5px; color: var(--text-3); margin-top: 2px; }
  .sig-right { text-align: right; flex-shrink: 0; }
  .sig-pnl { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; }
  .sig-status {
    display: inline-block; font-size: 9.5px; font-weight: 700;
    padding: 2px 7px; border-radius: 4px; margin-top: 3px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .sig-status.s-open    { background: var(--blue-soft);  color: var(--blue); }
  .sig-status.s-win     { background: var(--green-soft); color: var(--green); }
  .sig-status.s-loss    { background: var(--red-soft);   color: var(--red); }
  .sig-status.s-pending { background: var(--amber-soft); color: var(--amber); }

  /* ===================== CHARTS ===================== */
  .chart-toggle {
    display: inline-flex; background: var(--surface-3); border-radius: var(--r-sm);
    padding: 2px; gap: 1px;
  }
  .chart-toggle button {
    border: none; background: transparent; padding: 4px 8px;
    font-size: 10.5px; font-weight: 600; color: var(--text-3);
    cursor: pointer; border-radius: 6px; transition: all 0.15s;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .chart-toggle button.active { background: var(--surface); color: var(--text-1); }
  .chart-toggle button:hover:not(.active) { color: var(--text-1); }
  .chart-wrap { padding: 16px 16px 18px; height: 220px; position: relative; }
  @media (min-width: 768px) { .chart-wrap { padding: 16px 20px 20px; height: 240px; } }

  /* ===================== HISTORY ===================== */
  .history-list { padding: 0; }
  .hist-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 16px; border-bottom: 1px solid var(--line);
    font-size: 12.5px;
  }
  .hist-item:last-child { border-bottom: none; }
  @media (min-width: 768px) { .hist-item { padding: 12px 20px; } }
  .hist-time { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); width: 44px; flex-shrink: 0; }
  .hist-mid { flex: 1; min-width: 0; }
  .hist-sym { font-weight: 600; color: var(--text-1); font-size: 12.5px; }
  .hist-prices { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); margin-top: 2px; }
  .hist-right { text-align: right; flex-shrink: 0; }
  .result-pill {
    font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.06em; display: inline-block;
  }
  .result-pill.r-win  { background: var(--green-soft); color: var(--green); }

    return p.toLocaleString("en-IN", { maximumFractionDigits: 0 });

  if (sym === "GC=F") return p.toLocaleString("en-IN", { maximumFractionDigits: 2 });
  return p.toFixed(4);
};
const escapeHTML = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));

const relativeTime = (ts) => {
  if (!ts) return "—";
  const sec = Math.floor((Date.now() - ts) / 1000);
  if (sec < 5)   return "just now";
  if (sec < 60)  return sec + "s ago";
  if (sec < 3600) return Math.floor(sec/60) + "m ago";
  return Math.floor(sec/3600) + "h ago";
};

// ===========================
// API CALLS
// ===========================
async function apiFetch(path, opts = {}) {
  const url = CONFIG.API_BASE + path;
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 30000);
  try {
    const r = await fetch(url, { cache: "no-store", signal: ctrl.signal, ...opts });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally {
    clearTimeout(t);
  }
}

async function loadSnapshot() {
  if (state.isMock) {
    // MOCK: simulate realistic price drift
    if (state.snapshot) {
      state.snapshot.live_trades.forEach(t => {
        const drift = (Math.random() - 0.5) * 0.001;
        t.current = +(t.current * (1 + drift)).toFixed(t.current > 100 ? 2 : 4);
      });
    }
    return state.snapshot || MOCK;
  }
  return await apiFetch("/api/dashboard");
}

async function loadPrices() {
  if (state.isMock) return null;  // snapshot already has prices
  if (!state.snapshot?.live_trades?.length) return {};
  const symbols = state.snapshot.live_trades.map(t => t.symbol).join(",");
  try {
    const r = await apiFetch("/api/prices?symbols=" + encodeURIComponent(symbols));
    return r.prices || {};
  } catch (e) {
    return null;  // signal error
  }
}

// ===========================
// STATE MANAGEMENT
// ===========================
async function bootstrap() {
  console.log("[Dashboard] Starting bootstrap...");
  // Try API first
  try {
    const snap = await loadSnapshot();
    state.snapshot = snap;
    state.isMock = false;
    state.isOnline = true;
    state.lastError = null;
  } catch (e) {
    // API down or file:// — fall back to MOCK
    state.isMock = true;
    state.isOnline = false;
    state.snapshot = JSON.parse(JSON.stringify(MOCK));
    state.lastError = e.message;
  }
  state.lastFullUpdate = Date.now();
  state.lastPriceUpdate = Date.now();
  renderAll();
  startAutoRefresh();
  updateStatusUI();
}

async function refreshFull() {
  try {
    const snap = await loadSnapshot();
    state.snapshot = snap;
    state.isOnline = !state.isMock;
    state.lastFullUpdate = Date.now();
    state.lastError = null;
    renderAll();
    updateStatusUI();
  } catch (e) {
    state.lastError = e.message;
    updateStatusUI();
  }
}

async function refreshPrices() {
  if (state.isMock) {
    // For MOCK, simulate live drift
    if (state.snapshot?.live_trades) {
      state.prevPrices = {};
      state.snapshot.live_trades.forEach(t => {
        state.prevPrices[t.symbol] = t.current;
        const drift = (Math.random() - 0.5) * 0.0015;
        t.current = +(t.current * (1 + drift)).toFixed(t.current > 100 ? 2 : 4);
        if (t.direction === "LONG") {
          t.pnl_inr = (t.current - t.entry) * t.qty;
          t.progress = Math.max(0, Math.min(100, ((t.current - t.entry) / (t.tp - t.entry)) * 100));
        } else {
          t.pnl_inr = (t.entry - t.current) * t.qty;
          t.progress = Math.max(0, Math.min(100, ((t.entry - t.current) / (t.entry - t.tp)) * 100));
        }
      });
      state.lastPriceUpdate = Date.now();
      updateLiveTradesOnly();
      updateStatusUI();
    }
    return;
  }
  const prices = await loadPrices();
  if (!prices) {
    // API error on price refresh
    state.lastError = "Price refresh failed";
    updateStatusUI();
    return;
  }
  state.prevPrices = {};
  if (state.snapshot?.live_trades) {
    state.snapshot.live_trades.forEach(t => {
      state.prevPrices[t.symbol] = t.current;
      if (prices[t.symbol] != null) {
        t.current = prices[t.symbol];
        if (t.direction === "LONG") {
          t.pnl_inr = (t.current - t.entry) * t.qty;
          t.progress = Math.max(0, Math.min(100, ((t.current - t.entry) / (t.tp - t.entry)) * 100));
        } else {
          t.pnl_inr = (t.entry - t.current) * t.qty;
          t.progress = Math.max(0, Math.min(100, ((t.entry - t.current) / (t.entry - t.tp)) * 100));
        }
      }
    });
  }
  state.lastPriceUpdate = Date.now();
  updateLiveTradesOnly();
  updateStatusUI();
}

function startAutoRefresh() {
  state.intervals.forEach(clearInterval);
  state.intervals = [
    setInterval(refreshFull,   CONFIG.REFRESH_FULL_MS),
    setInterval(refreshPrices, CONFIG.REFRESH_PRICE_MS),
  ];
}

function manualRefresh() {
  const btn = document.getElementById("refreshBtn");
  btn.classList.add("spinning");
  setTimeout(() => btn.classList.remove("spinning"), 600);
  refreshFull();
  refreshPrices();
}

function updateStatusUI() {
  const pill = document.getElementById("statusPill");
  const text = document.getElementById("statusText");
  const errBanner = document.getElementById("errorBanner");
  const errText = document.getElementById("errorText");

  pill.className = "status-pill";
  if (state.isMock) {
    pill.classList.add("s-demo");
    text.textContent = "DEMO";
    errBanner.style.display = "none";
  } else if (!state.isOnline) {
    pill.classList.add("s-error");
    text.textContent = "OFFLINE";
    if (state.lastError) {
      errText.textContent = `Couldn't reach /api/dashboard: ${state.lastError}. Showing cached data.`;
      errBanner.style.display = "flex";
    }
  } else {
    const age = state.lastPriceUpdate ? (Date.now() - state.lastPriceUpdate) / 1000 : 999;
    if (age > 60) {
      pill.classList.add("s-stale");
      text.textContent = "STALE";
    } else {
      pill.classList.add("s-live");
      text.textContent = "LIVE";
    }
    errBanner.style.display = "none";
  }

  document.getElementById("updatedText").textContent = "· " + relativeTime(state.lastFullUpdate);
  document.getElementById("liveTradesAge").textContent = state.lastPriceUpdate ? relativeTime(state.lastPriceUpdate) : "—";
}

function updateClock() {
  const now = new Date();
  const ist = new Date(now.getTime() + (5.5 * 60 - now.getTimezoneOffset()) * 60 * 1000);
  const hh = String(ist.getHours()).padStart(2,"0");
  const mm = String(ist.getMinutes()).padStart(2,"0");
  const ss = String(ist.getSeconds()).padStart(2,"0");
  const dd = String(ist.getDate()).padStart(2,"0");
  const mo = String(ist.getMonth() + 1).padStart(2,"0");
  document.getElementById("clock").innerHTML = `<b>${hh}:${mm}:${ss}</b> IST <span class="updated" id="updatedText">· ${relativeTime(state.lastFullUpdate)}</span> · ${dd}/${mo}`;
  updateStatusUI();
}

// SMART PARTIAL UPDATE — only touch the live trade cells, not rebuild
function updateLiveTradesOnly() {
  const trades = state.snapshot?.live_trades || [];
  trades.forEach(t => {
    const isLong = t.direction === "LONG";
    const plClass = t.pnl_inr >= 0 ? "pos" : "neg";
    const plPct = ((t.current - t.entry) / t.entry * 100 * (isLong ? 1 : -1));
    const prev = state.prevPrices[t.symbol];

    const flash = (prev != null && prev !== t.current)
      ? (t.current > prev ? "flash-up" : "flash-down")
      : null;

    // Helper to update + flash
    const upd = (selector, html) => {
      const els = document.querySelectorAll(selector);
      els.forEach(el => {
        el.innerHTML = html;
        if (flash) {
          el.classList.remove("flash-up", "flash-down");
          void el.offsetWidth;  // force reflow to restart animation
          el.classList.add(flash);
          setTimeout(() => el.classList.remove(flash), 800);
        }
      });
    };

    upd(`[data-trade="${CSS.escape(t.symbol)}"][data-field="pnl"]`,
        `${t.pnl_inr >= 0 ? '+' : ''}${fmtINR(t.pnl_inr)}`);
    upd(`[data-trade="${CSS.escape(t.symbol)}"][data-field="pct"]`,
        `${plPct >= 0 ? '+' : ''}${plPct.toFixed(2)}%`);
    upd(`[data-trade="${CSS.escape(t.symbol)}"][data-field="current"]`,
        fmtPrice(t.current, t.symbol));
    upd(`[data-trade="${CSS.escape(t.symbol)}"][data-field="current-mobile"]`,
        fmtPrice(t.current, t.symbol));
    upd(`[data-trade="${CSS.escape(t.symbol)}"][data-field="progress-mobile"]`,
        `${t.progress.toFixed(0)}%`);

    // Progress bars (width)
    document.querySelectorAll(`[data-trade="${CSS.escape(t.symbol)}"][data-field="progress-bar"], [data-trade="${CSS.escape(t.symbol)}"][data-field="progress-bar-mobile"]`).forEach(el => {
      el.style.width = t.progress + "%";
    });

    // Update PNL class (color)
    document.querySelectorAll(`[data-trade="${CSS.escape(t.symbol)}"][data-field="pnl"]`).forEach(el => {
      el.classList.remove("t-green", "t-red", "pos", "neg");
      el.classList.add(t.pnl_inr >= 0 ? (el.classList.contains("mono") ? "t-green" : "pos") : (el.classList.contains("mono") ? "t-red" : "neg"));
    });
  });
}

function renderHistory() {

      ? `<span class="result-pill r-win">WIN</span>`
      : `<span class="result-pill r-loss">LOSS</span>`;
    return `<div class="hist-item">
      <div class="hist-time">${escapeHTML(t.time || "")}</div>
      <div class="hist-mid">
        <div class="hist-sym">${escapeHTML(t.sym)} <span class="dir-badge ${isLong ? 'long' : 'short'}">${t.dir}</span></div>
        <div class="hist-prices">${fmtPrice(t.entry, t.sym)} → ${fmtPrice(t.exit, t.sym)} · ${escapeHTML(t.account)}</div>
      </div>
      <div class="hist-right">${res}<div class="mono t-${t.pnl >= 0 ? 'green' : 'red'}" style="font-size:12px; font-weight:600; margin-top:3px;">${t.pnl >= 0 ? '+' : ''}${fmtINR(t.pnl)}</div></div>
    </div>`;
  }).join("");
}

function renderPending() {
  const pending = state.snapshot.pending || [];
  document.getElementById("pendingCount").textContent = pending.length;
  if (pending.length === 0) {
    document.getElementById("pendingList").innerHTML = `<div class="empty">No pending setups.</div>`;
    return;
  }
  document.getElementById("pendingList").innerHTML = pending.map(p => {
    const isBull = p.dir === "BULLISH";
    const expPct = Math.max(0, Math.min(100, ((p.expires_h || 0) / 24) * 100));
    const zoneClass = p.zone ? "" : "empty";
    const zoneTxt = p.zone
      ? `$${p.zone[0].toLocaleString()} — $${p.zone[1].toLocaleString()}`
      : "FVG not yet formed";
    const statusClass = p.status === "waiting-fill" ? "ps-fill" : "ps-fvg";
    const statusText = p.status === "waiting-fill" ? "WAITING FILL" : "WAITING FVG";
    return `<div class="pending-item">
      <div class="pending-head">
        <div class="pending-sym">${escapeHTML(p.sym)}<span class="dir-badge ${isBull ? 'long' : 'short'}">${p.dir}</span></div>
        <span class="pending-status ${statusClass}">${statusText}</span>
      </div>
      <div class="pending-zone ${zoneClass}">${zoneTxt}</div>
      <div class="pending-expiry">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Expires in ${(p.expires_h || 0).toFixed(1)}h
      </div>
      <div class="expiry-bar"><div class="expiry-fill" style="width: ${expPct}%"></div></div>
    </div>`;
  }).join("");
}

function renderNews() {
  const newsRaw = state.snapshot.news_raw || [];
  const dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  // Group by date
  const byDate = {};
  newsRaw.forEach(e => {
    const d = e.date || "";
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(e);
  });
  // Also include MOCK news if present (for demo)
  if (state.snapshot.news && typeof state.snapshot.news === 'object') {
    Object.entries(state.snapshot.news).forEach(([d, evs]) => {
      if (!byDate[d]) byDate[d] = evs;
    });
  }
  const today = new Date().toISOString().slice(0, 10);
  const dates = Object.keys(byDate).sort();

  if (dates.length === 0) {
    document.getElementById("newsGrid").innerHTML = `<div class="empty">No upcoming events.</div>`;
    return;
  }
  document.getElementById("newsGrid").innerHTML = dates.map(date => {
    const events = byDate[date];
    const d = new Date(date + "T00:00:00");
    const dn = dayNames[d.getDay()];
    const isToday = date === today;
    const high = events.filter(e => (e.impact || '').toLowerCase() === 'high' || (e.impact || '').toUpperCase() === 'RED').length;
    const highBadge = high > 0 ? `<span class="high-tag">${high} HIGH</span>` : "";
    const eventsHtml = events.map(e => {
      const impact = (e.impact || '').toLowerCase();
      const impactClass = impact === 'high' || impact === 'red' ? 'i-high' : impact === 'med' || impact === 'yellow' || impact === 'orange' ? 'i-med' : 'i-low';
      const parts = (e.time || "00:00").split(":");
      const h = parseInt(parts[0]) || 0;
      const istH = String((h + 9) % 24).padStart(2, "0");
      const istM = parts[1] || "00";
      return `<div class="news-event">
        <div class="news-impact ${impactClass}"></div>
        <div class="news-time">${e.time || "—"} ET<span class="ist">${istH}:${istM} IST</span></div>
        <div class="news-curr">${escapeHTML(e.country || e.currency || "—")}</div>
        <div class="news-title-block">
          <div class="news-title">${escapeHTML(e.title || "")}</div>
          <div class="news-meta">${e.forecast ? 'fcst ' + e.forecast : '—'} ${e.previous ? '· prev ' + e.previous : ''}</div>
        </div>
      </div>`;
    }).join("");
    return `<div class="news-day">
      <div class="news-day-head">
        <div class="news-day-name ${isToday ? 'today' : ''}">${dn} <span class="date">${date}</span></div>
        <div class="news-count">${events.length}${highBadge}</div>
      </div>
      ${eventsHtml}
    </div>`;
  }).join("");
}

// ===========================
// CHARTS
// ===========================
let cumChart, dailyChart;
const CHART_DEFAULTS = { color: "#9aa3b8", font: { family: "'Outfit', sans-serif", size: 10 } };

// Compute cumulative P/L series from history
function extractDate(t) {
  // closed_at is full ISO like "2025-07-31T13:45:00"
  // timestamp can be ms number or ISO
  // time might be just "13:45" (no date) — only use as last resort
  const c = t.closed_at || t.timestamp || t.date;
  if (c == null) return null;
  if (typeof c === "number") {
    // treat as ms timestamp
    const d = new Date(c);
    return isNaN(d) ? null : d.toISOString().slice(0, 10);
  }
  const s = String(c);
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  if (/^\d{4}\/\d{2}\/\d{2}/.test(s)) return s.slice(0, 10).replace(/\//g, "-");
  return null;  // time-only like "13:45" — no date
}

function computeCumSeries(accountFilter) {
  const history = (state.snapshot.history || []).filter(t => !accountFilter || t.account === accountFilter);
  const byDate = {};
  history.forEach(t => {
    const date = extractDate(t);
    if (!date) return;
    byDate[date] = (byDate[date] || 0) + (t.pnl || 0);
  });
  const dates = Object.keys(byDate).sort();
  let cum = 0;
  const series = dates.map(d => { cum += byDate[d]; return { d, v: cum }; });
  return {
    labels: series.map(s => s.d.slice(5)),  // MM-DD
    data: series.map(s => Math.round(s.v)),
  };
}

function computeDailySeries(range) {
  const history = state.snapshot.history || [];
  const byDate = {};
  history.forEach(t => {
    const date = extractDate(t);
    if (!date) return;
    byDate[date] = (byDate[date] || 0) + (t.pnl || 0);
  });
  const allDates = Object.keys(byDate).sort();
  const days = range === "week" ? 5 : 30;
  const filtered = allDates.slice(-days).map(d => ({ d, v: byDate[d] }));
  // Pad to N days
  while (filtered.length < days) {
    filtered.unshift({ d: "—", v: 0 });
  }
  return {
    labels: filtered.map(s => range === "week" ? ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][new Date(s.d + "T00:00:00").getDay()] : s.d.slice(8)),
    data: filtered.map(s => Math.round(s.v)),
  };
}

function initCumChart(series) {
  const ctx = document.getElementById("cumPLChart").getContext("2d");
  if (cumChart) cumChart.destroy();
  cumChart = new Chart(ctx, {
    type: "line",
    data: {
      labels: series.labels,
      datasets: [{
        data: series.data,
        borderColor: "#00d68f",
        backgroundColor: ctx => {
          const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 240);
          g.addColorStop(0, "rgba(0,214,143,0.25)");
          g.addColorStop(1, "rgba(0,214,143,0)");
          return g;
        },
        borderWidth: 2,
        fill: true,
        tension: 0.32,
        pointRadius: 0,
        pointHoverRadius: 5,
        pointBackgroundColor: "#00d68f",
        pointBorderColor: "#0a0e1a",
        pointBorderWidth: 2,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#1a2032", borderColor: "rgba(255,255,255,0.1)", borderWidth: 1,
          padding: 10, cornerRadius: 8, displayColors: false, titleColor: "#9aa3b8", bodyColor: "#e8ecf5",
          callbacks: { label: c => "₹" + c.parsed.y.toLocaleString("en-IN") },
        },
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: "#5d6477", font: CHART_DEFAULTS.font } },
        y: { grid: { color: "rgba(255,255,255,0.04)" }, ticks: { color: "#5d6477", font: CHART_DEFAULTS.font, callback: v => "₹" + (v/1000).toFixed(0) + "K" } },
      },
    },
  });
}

function initDailyChart(series) {
  const ctx = document.getElementById("dailyPLChart").getContext("2d");
  if (dailyChart) dailyChart.destroy();
  dailyChart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: series.labels,
      datasets: [{
        data: series.data,
        backgroundColor: series.data.map(v => v >= 0 ? "rgba(0,214,143,0.7)" : "rgba(255,77,106,0.7)"),
        borderColor: series.data.map(v => v >= 0 ? "#00d68f" : "#ff4d6a"),
        borderWidth: 1, borderRadius: 4, borderSkipped: false,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#1a2032", borderColor: "rgba(255,255,255,0.1)", borderWidth: 1,
          padding: 10, cornerRadius: 8, displayColors: false, titleColor: "#9aa3b8", bodyColor: "#e8ecf5",
          callbacks: { label: c => (c.parsed.y >= 0 ? "+" : "") + "₹" + c.parsed.y.toLocaleString("en-IN") },
        },
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: "#5d6477", font: CHART_DEFAULTS.font } },
        y: { grid: { color: "rgba(255,255,255,0.04)" }, ticks: { color: "#5d6477", font: CHART_DEFAULTS.font, callback: v => (v >= 0 ? "+" : "") + "₹" + (v/1000).toFixed(0) + "K" } },
      },
    },
  });
}

function switchCumChart(key, btn) {
  document.querySelectorAll("[data-cum]").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
  initCumChart(computeCumSeries(key === "all" ? null : key));
}
function switchDailyChart(key, btn) {
  document.querySelectorAll("[data-daily]").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
  initDailyChart(computeDailySeries(key));
}

function renderAll() {
  if (!state.snapshot) {
    state.snapshot = MOCK;
  }
  renderKpis();
  renderAccounts();
  renderLiveTrades();
  renderSignals();
  renderHistory();
  renderPending();
  renderNews();
  initCumChart(computeCumSeries(null));
  initDailyChart(computeDailySeries("week"));
}

// ===========================
// BOOTSTRAP
// ===========================
document.querySelectorAll("[data-cum]").forEach(b => b.addEventListener("click", () => switchCumChart(b.dataset.cum, b)));
document.querySelectorAll("[data-daily]").forEach(b => b.addEventListener("click", () => switchDailyChart(b.dataset.daily, b)));
updateClock();
setInterval(updateClock, 1000);

bootstrap();
</script>
